# Install under /etc/nginx/conf.d/.
# Must be included inside nginx's HTTP context.
# Initial public policy; tune after real traffic tests.

limit_req_zone $binary_remote_addr
    zone=forgesight_inspect:10m rate=10r/m;

limit_conn_zone $binary_remote_addr
    zone=forgesight_per_ip:10m;

limit_req_status 429;
limit_conn_status 429;
