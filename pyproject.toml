[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgesight-ai"
version = "0.1.0"
description = "Research PCB anomaly inspection with verified CPU inference and human review"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "ForgeSight AI contributors"}]
dependencies = ["Pillow>=10,<13"]

[project.urls]
Homepage = "https://forgesight-ai-6d5yatbeia-el.a.run.app/"
Repository = "https://github.com/ksuyamburaj07/ForgeSight-AI"
Issues = "https://github.com/ksuyamburaj07/ForgeSight-AI/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

service = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2.10,<3",
]

# Verified Linux CPU source-CI requirements, 2026-11-20.
# Install the CPU PyTorch wheels first; see the runtime guide.
inference = [
    "numpy==2.5.4",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "transformers==4.57.6",
    "safetensors==0.8.0",
    "huggingface-hub==0.36.2",
    "tokenizers==0.22.2",
]

# Historical image-processing and evaluation utilities.
# Verified in the November 2026 Linux cleanroom.
research = [
    "opencv-python-headless==4.14.0.94",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[project.scripts]
forgesight = "forgesight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
