[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgesight-ai"
version = "0.0.1"
description = "Research PCB anomaly inspection with verified CPU inference and human review"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "ForgeSight AI contributors"}]
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

service = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2.10,<3",
]

# Observed working Linux CPU environment, 2026-11-20.
# Clean-environment installation remains a release gate.
inference = [
    "numpy==2.5.4",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "transformers==4.57.6",
    "safetensors==0.8.0",
    "huggingface-hub==0.36.2",
    "tokenizers==0.22.2",
]

[project.scripts]
forgesight = "forgesight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
